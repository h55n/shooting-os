name: Verify

on:
  push:
    branches:
      - master
      - 'build/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Repository verification
        id: verify
        continue-on-error: true
        run: npm run verify

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Fail if any verification step failed
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.typecheck.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.verify.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
